[package]
name = "capture"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
zx-core.workspace = true
zx-ui.workspace = true
serde.workspace = true
serde_json.workspace = true
# GIF 容器 + LZW。默认 feature 会带 color_quant（NeuQuant），我们用自写的中位切分，
# 用不上它，关掉能少编一个 crate。（若某些 API 需要默认 feature，去掉 default-features 即可。）
gif = { version = "0.14", default-features = false, features = ["std"] }

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_Media_MediaFoundation",
  "Win32_Media_Multimedia",
  "Win32_Media_Audio",
  "Win32_UI_Shell_PropertiesSystem",
  "Media_Ocr",
  "AI_MachineLearning",
  "Foundation_Collections",
  "Graphics_Imaging",
  "Storage_Streams",
  "Win32_Storage_FileSystem",
  "Win32_Networking_WinHttp",
]
