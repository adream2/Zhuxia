[package]
name = "zhuxia"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry", "compression"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
base64 = "0.21"
zx-core.workspace = true
zx-ui.workspace = true
taskmon = { path = "../taskmon" }
clipboard = { path = "../clipboard" }
capture = { path = "../capture" }
gesture = { path = "../gesture" }
imgconv = { path = "../imgconv" }
appicon = { path = "../appicon" }
imgbed = { path = "../imgbed" }
zx-media = { path = "../zx-media" }

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls_Dialogs",
  "Win32_Graphics_Gdi",
  "Win32_System_Threading",
]

[[bin]]
name = "zhuxia"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
