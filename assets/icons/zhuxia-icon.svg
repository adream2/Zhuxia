<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B273B"/>
      <stop offset="1" stop-color="#090E16"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#74F2D6"/>
      <stop offset="1" stop-color="#1EBAA0"/>
    </linearGradient>
    <linearGradient id="recess" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04080E" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#04080E" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="inner"><rect x="358" y="394" width="308" height="276" rx="14"/></clipPath>
  </defs>

  <!-- 底板 -->
  <rect x="52" y="52" width="920" height="920" rx="224" fill="url(#ink)"/>
  <rect x="52.5" y="52.5" width="919" height="919" rx="223.5" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- 匣体内壁暗角 -->
  <g clip-path="url(#inner)">
    <rect x="358" y="394" width="308" height="80" fill="url(#recess)"/>
  </g>

  <!-- 匣体：外沿 300..724，描边 58 居中于路径 -->
  <rect x="329" y="365" width="366" height="334" rx="43" fill="none"
        stroke="#EAF1FA" stroke-width="58"/>

  <!-- 匣中之物 -->
  <rect x="419" y="439" width="186" height="186" rx="50" fill="url(#mint)"/>
</svg>
