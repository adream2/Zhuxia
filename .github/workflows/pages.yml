name: 宣传页

# 独立于发布流程的入口：
#   · workflow_dispatch —— 首次上线、或改了站点代码想立刻看效果
#   · push 到 main 且改动落在 site/ 下 —— 设计/文案调整自动重新部署
#
# 为什么不用 `on: release: published`：release.yml 里的 Release 是用默认 GITHUB_TOKEN
# 创建的，而 GitHub 不会因为 GITHUB_TOKEN 的动作再触发另一个 workflow。所以「发布后
# 更新宣传页」这一步放在 release.yml 内部完成（见那边的 site job），这里只负责手动/改动触发。

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 同一时间只允许一个部署
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: 生成站点
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 更新日志要用到全部标签与提交历史
          fetch-depth: 0

      - id: pages
        uses: actions/configure-pages@v5

      - name: 生成 _site
        env:
          # 读发布列表与资源链接（公开仓库只读即可）
          GH_TOKEN: ${{ github.token }}
          # canonical / og:url / sitemap 需要绝对地址；自定义域名时这里自动跟着变
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: python3 site/build.py --out _site

      - name: 检查产物
        run: |
          set -euo pipefail
          # 完整清单由 site/build.py 的 verify() 自己校验（缺文件、空文件、未替换占位符都会直接失败），
          # 这里只做一次可读的汇总，避免两处清单各写一份、改一处忘另一处。
          echo "产物 $(find _site -type f | wc -l) 个文件，$(du -sh _site | cut -f1)"
          ls _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: 部署到 Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
