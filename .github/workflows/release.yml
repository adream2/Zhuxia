name: 发布构建

# 只允许手动触发：发版是人的决定，机器只做「校验 → 编译 → 打包 → 建标签 → 发 Release」。
#
# 三者共用同一个版本号（`validate` 的 outputs.version），任何一处对不上就直接失败：
#   · 标签 / Release：v<version>，预览版（最右位非 0）自动标成 prerelease
#   · 运行产物：zhuxia-<version>-win-x64.zip
#   · 源码包：  zhuxia-<version>-src.zip
#
# 版本号只有一个真源：Cargo.toml 的 [workspace.package] version。
# exe 的 VERSIONINFO 由 crates/zhuxia/build.rs 从 CARGO_PKG_VERSION 生成，
# 界面里的版本号也来自同一个值，所以发版只需要改 Cargo.toml（+ Cargo.lock + tauri.conf.json）。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "目标版本号，必须与 Cargo.toml 的 [workspace.package] version 一致；最右位 0=正式，非 0=预览（可叠加）"
        required: true
        type: string
      create_release:
        description: "创建 v<版本> 标签并发布 GitHub Release；关闭则只产出可下载的构建产物"
        required: true
        type: boolean
        default: true
      draft:
        description: "Release 存为草稿，人工确认后再公开（仅 create_release=true 时生效）"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

# 同一个版本号不允许并发跑两遍（会抢标签）
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # 单次构建用不上增量，关掉省缓存体积
  CARGO_INCREMENTAL: "0"

jobs:
  validate:
    name: 版本号校验
    runs-on: windows-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      channel: ${{ steps.check.outputs.channel }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      zip: ${{ steps.check.outputs.zip }}
      src_zip: ${{ steps.check.outputs.src_zip }}
    steps:
      - uses: actions/checkout@v4
        with:
          # 要拿全部标签来判断版本高低、查重
          fetch-depth: 0

      - id: check
        name: 校验输入 / 真源 / 标签 / 版本高低
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          fail() {
            echo "::error title=版本号校验失败::$1"
            echo "❌ $1" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          V="$(printf '%s' "$INPUT_VERSION" | tr -d '[:space:]')"

          # 1. 格式：只接受 major.minor.patch
          if [[ ! "$V" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            fail "版本号必须是 x.y.z 三段数字，收到「$V」"
          fi
          PATCH="${BASH_REMATCH[3]}"

          # 2. 项目规则：最右位 0=正式、非 0=预览（docs/ARCHITECTURE.md「版本号」）
          #    预览版可以叠加（0.0.2、0.0.3…），所以这里不限制取值，
          #    只在校验末尾按 0 / 非 0 分渠道（见第 5 步）。

          # 3. 单一真源必须同步：Cargo.toml → Cargo.lock → tauri.conf.json
          CARGO_V="$(grep -A20 '^\[workspace.package\]' Cargo.toml | grep -m1 '^version' | sed 's/[^0-9.]//g')"
          LOCK_V="$(grep -A2 '^name = "zhuxia"$' Cargo.lock | grep -m1 '^version' | sed 's/[^0-9.]//g')"
          TAURI_V="$(grep -m1 '"version"' crates/zhuxia/tauri.conf.json | sed 's/[^0-9.]//g')"
          [[ "$CARGO_V" == "$V" ]] || fail "Cargo.toml 的 workspace version 是 $CARGO_V，与输入 $V 不一致；先把源码版本改好再触发"
          [[ "$LOCK_V" == "$V" ]] || fail "Cargo.lock 里的 zhuxia 还是 $LOCK_V；本地跑一次 cargo build 让锁文件跟上并提交"
          [[ "$TAURI_V" == "$V" ]] || fail "crates/zhuxia/tauri.conf.json 的 version 是 $TAURI_V，应为 $V"

          # 4. 标签查重 + 版本不能倒退
          TAG="v$V"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            fail "标签 $TAG 已存在；同一版本不能重复发布"
          fi
          LATEST="$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -1)"
          if [[ -n "$LATEST" ]]; then
            HIGHEST="$(printf '%s\n%s\n' "$LATEST" "$V" | sort -V | tail -1)"
            [[ "$HIGHEST" == "$V" ]] || fail "版本 $V 低于已发布的最新版本 $LATEST"
          fi

          # 5. 派生出后面的命名与 Release 属性，全部来自同一个 $V
          if [[ "$PATCH" == "0" ]]; then CHANNEL="正式版"; PRE="false"; else CHANNEL="预览版"; PRE="true"; fi
          {
            echo "version=$V"
            echo "tag=$TAG"
            echo "channel=$CHANNEL"
            echo "prerelease=$PRE"
            echo "zip=zhuxia-$V-win-x64.zip"
            echo "src_zip=zhuxia-$V-src.zip"
          } >> "$GITHUB_OUTPUT"

          {
            echo "## 发布前校验通过"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本号 | \`$V\` |"
            echo "| 类型 | $CHANNEL（prerelease=$PRE） |"
            echo "| 标签 / Release | \`$TAG\` |"
            echo "| 运行产物 | \`zhuxia-$V-win-x64.zip\` |"
            echo "| 源码包 | \`zhuxia-$V-src.zip\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: 编译与打包
    needs: validate
    runs-on: windows-latest
    # rustsec/audit-check 要把结果写成 check run，缺 checks: write 会报
    # 「Resource not accessible by integration」——审计照样跑，但结论看不到。
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 cargo 依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: 工具链信息
        shell: pwsh
        run: |
          rustc -V
          cargo -V

      - name: 静态检查（clippy）
        # 本地靠自觉跑 clippy，最后总会被忘掉；这里把它变成硬闸门。
        # 只对"新引入的告警"拦截——代码库当前是 0 告警，标准就定在这里。
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 依赖安全公告
        # 541 个包，靠人肉盯 CVE 不现实。先用 rustsec/audit-check 跑起来观察，
        # 稳定后再去掉 continue-on-error：现在它一旦报新公告就会红，容易挡住正常发版。
        continue-on-error: true
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 单元测试
        run: cargo test --workspace --locked

      - name: 编译 release
        run: cargo build --release --locked --bin zhuxia

      - name: 校验 exe 内嵌版本号
        shell: pwsh
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $info = (Get-Item "target/release/zhuxia.exe").VersionInfo
          "FileVersion=$($info.FileVersion) ProductVersion=$($info.ProductVersion)"
          if ($info.ProductVersion -ne $env:VERSION) {
            Write-Error "exe 的 ProductVersion 是 '$($info.ProductVersion)'，与目标版本 '$env:VERSION' 不一致（应由 build.rs 从 Cargo.toml 生成）"
            exit 1
          }

      - name: 打包（运行产物 + 源码包 + 校验和）
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ZIP: ${{ needs.validate.outputs.zip }}
          SRC_ZIP: ${{ needs.validate.outputs.src_zip }}
          SYM_ZIP: zhuxia-${{ needs.validate.outputs.version }}-win-x64-symbols.zip
        run: |
          set -euo pipefail
          rm -rf dist "$ZIP" "$SRC_ZIP" "$SYM_ZIP" SHA256SUMS.txt
          mkdir -p dist
          # 运行时只需要 exe：图标、VERSIONINFO、设置面板的前端资源都已内嵌
          cp target/release/zhuxia.exe dist/
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md README.md dist/
          powershell -NoProfile -Command "Compress-Archive -Path 'dist\*' -DestinationPath '$ZIP' -CompressionLevel Optimal -Force"
          # 符号包单独发：exe 是 strip 过的，线上 panic 的行号只能靠这份 .pdb 还原。
          # 它不进用户包（34 MB），但必须跟同一个版本一起归档，否则等于没开 debug=1。
          if [[ -f target/release/zhuxia.pdb ]]; then
            powershell -NoProfile -Command "Compress-Archive -Path 'target\release\zhuxia.pdb' -DestinationPath '$SYM_ZIP' -CompressionLevel Optimal -Force"
          else
            echo "::warning::没有生成 zhuxia.pdb，符号包将缺失（线上崩溃无法还原行号）"
          fi
          # 源码包与该标签指向同一个提交
          git archive --format=zip --prefix="zhuxia-$VERSION/" -o "$SRC_ZIP" HEAD
          sha256sum "$ZIP" "$SRC_ZIP" > SHA256SUMS.txt
          if [[ -f "$SYM_ZIP" ]]; then sha256sum "$SYM_ZIP" >> SHA256SUMS.txt; fi
          cat SHA256SUMS.txt
          du -h "$ZIP" "$SRC_ZIP"

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: zhuxia-${{ needs.validate.outputs.version }}
          path: |
            ${{ needs.validate.outputs.zip }}
            ${{ needs.validate.outputs.src_zip }}
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      - name: 上传符号包
        # 单独一步 + `continue-on-error`：符号包缺失不该拦住发版，但要在日志里留痕
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: zhuxia-${{ needs.validate.outputs.version }}-symbols
          path: zhuxia-${{ needs.validate.outputs.version }}-win-x64-symbols.zip
          if-no-files-found: warn
          retention-days: 90

      - name: 写入汇总
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          ZIP: ${{ needs.validate.outputs.zip }}
          SRC_ZIP: ${{ needs.validate.outputs.src_zip }}
        run: |
          {
            echo "## 构建产物"
            echo ""
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: 建标签并发布
    needs: [validate, build]
    if: ${{ inputs.create_release }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: zhuxia-${{ needs.validate.outputs.version }}

      - uses: actions/download-artifact@v4
        # 符号包是可选资产：拿不到就照常发版
        continue-on-error: true
        with:
          name: zhuxia-${{ needs.validate.outputs.version }}-symbols

      - name: gh release create
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # 这个 job 没有 checkout，gh 无法从工作目录推断仓库
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
          PRERELEASE: ${{ needs.validate.outputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
          ZIP: ${{ needs.validate.outputs.zip }}
          SRC_ZIP: ${{ needs.validate.outputs.src_zip }}
        run: |
          set -euo pipefail
          EXTRA=()
          if [[ "$PRERELEASE" == "true" ]]; then EXTRA+=(--prerelease); fi
          if [[ "$DRAFT" == "true" ]]; then EXTRA+=(--draft); fi
          ASSETS=("$ZIP" "$SRC_ZIP" SHA256SUMS.txt)
          # 符号包（.pdb）单独作为资产：用户不需要，但排查线上崩溃必须有
          SYM_ZIP="zhuxia-$VERSION-win-x64-symbols.zip"
          if [[ -f "$SYM_ZIP" ]]; then
            ASSETS+=("$SYM_ZIP")
          else
            echo "::warning::符号包不存在，本次 Release 不带 .pdb"
          fi
          # --target 让标签落在触发这次构建的提交上，和源码包/产物同源
          gh release create "$TAG" \
            "${ASSETS[@]}" \
            --target "$GITHUB_SHA" \
            --title "$TAG（$CHANNEL）" \
            --generate-notes \
            "${EXTRA[@]}"
          echo "发布完成：$TAG" >> "$GITHUB_STEP_SUMMARY"

  # 宣传页分两个 job，和 pages.yml 保持同一个形状。
  #
  # 为什么不能合成一个 job：`upload-pages-artifact` 与 `deploy-pages` 紧挨着跑时，
  # 出现过 deploy 侧列产物只拿到 2 个（build 的那两个）、报
  # 「No artifacts named "github-pages"」的情况——而 run 结束时该产物明明在。
  # 也就是说上传成功、但产物索引在同一个 job 内还没可见。
  # pages.yml 用 build → deploy 两个 job，8 次全绿；这里照抄（代价只有几十秒）。
  site_build:
    name: 生成宣传页
    needs: [validate, release]
    # 草稿不算发布：草稿态不部署，等人工发布后再跑一次「宣传页」工作流
    if: ${{ inputs.create_release && !inputs.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # 下面那步要删掉本 run 里残留的 github-pages 产物
      actions: write
    steps:
      # `upload-pages-artifact` 没有 overwrite 参数：同一个 run 里重跑一次，
      # 就会存在第二个 `github-pages`，而 `deploy-pages` 见到重名直接报
      # 「Multiple artifacts named "github-pages"」——它没法猜该部署哪一份。
      # 发版流程一旦因为网络抖动要重跑，就会被这个卡死，所以上传前先清干净。
      - name: 清掉本 run 里残留的 github-pages
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          api="repos/${GITHUB_REPOSITORY}/actions"
          ids=$(gh api "${api}/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                  --jq '.artifacts[] | select(.name=="github-pages") | .id' || true)
          if [[ -z "$ids" ]]; then
            echo "没有残留的 github-pages 产物"
            exit 0
          fi
          for id in $ids; do
            echo "删除残留产物 id=$id"
            gh api -X DELETE "${api}/artifacts/${id}" || echo "::warning::删除 $id 失败（可能已被别处删掉）"
          done
          left=$(gh api "${api}/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
                  --jq '[.artifacts[] | select(.name=="github-pages")] | length')
          if [[ "$left" != "0" ]]; then
            echo "::error::仍残留 $left 个 github-pages 产物；不清理掉，部署必然因为重名失败"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          # 更新日志按标签区间汇总，需要完整历史
          fetch-depth: 0

      - id: pages
        uses: actions/configure-pages@v5

      - name: 生成宣传页
        env:
          GH_TOKEN: ${{ github.token }}
          # 与 pages.yml 保持一致：自定义域名是绝对地址的唯一来源（页面的 canonical、
          # sitemap、og:image 都按它拼）。改域名要同时改这两个工作流。
          SITE_DOMAIN: zhuxia.ztsite.com
          # 与 Settings → Pages 的实际域名对账（见 site/build.py 的 check_pages_host）
          PAGES_HOST: ${{ steps.pages.outputs.host }}
        run: python3 site/build.py --out _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  site_deploy:
    name: 部署宣传页
    needs: [validate, site_build]
    runs-on: ubuntu-latest
    # 与 pages.yml 的 deploy job 保持同一组权限（那边 8 次全绿）。
    # deploy-pages 的文档只要求 pages + id-token，但 contents: read 在 pages.yml 里
    # 是有继承的，多给这一项零成本，没必要赌。
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: 写入汇总
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          {
            echo "## 宣传页已更新"
            echo ""
            echo "版本 \`v$VERSION\` 的下载入口与更新日志已同步到 GitHub Pages。"
          } >> "$GITHUB_STEP_SUMMARY"
